services:
  backend:
    build:
      context: ./backend
    container_name: job-getter-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://backend:8000
    container_name: job-getter-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://backend:8000
